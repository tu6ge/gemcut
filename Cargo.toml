[package]
name = "gemcut"
version = "0.1.0"
edition = "2024"
description = "a tool to formatter ruby code using ruby-prism"
authors = ["tu6ge <772364230@qq.com>"]
license = "MIT"

[dependencies]
ruby-prism = "1.9.0"
clap = { version = "4.0", features = ["derive"] }
ignore = "0.4"
rayon = "1.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
glob = "0.3"